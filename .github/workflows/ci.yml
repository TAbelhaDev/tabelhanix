name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: tabelhanix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Check flake
        run: nix flake check --no-build

      - name: Check formatting
        run: nix fmt --check .

  build:
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        config:
          - tabelhanix
          - tabelhanix-nvidia
          - tabelhanix-minimal
          - tabelhanix-laptop
          - tabelhanix-intel
          - tabelhanix-amd
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: tabelhanix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ${{ matrix.config }}
        run: |
          nix build \
            --option narinfo-cache-negative-ttl 0 \
            .#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel \
            -o result-${{ matrix.config }}

      - name: Store closure size
        run: |
          echo "Closure size for ${{ matrix.config }}:"
          du -shL result-${{ matrix.config }} 2>/dev/null || echo "Build artifact not found"
