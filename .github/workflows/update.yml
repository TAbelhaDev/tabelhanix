name: Update Flake Inputs

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am
  workflow_dispatch:

jobs:
  update:
    name: Update inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: Update flake inputs
        run: nix flake update

      - name: Check if inputs changed
        id: changes
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/flake-inputs-update
          title: 'chore: update flake inputs'
          body: |
            Automated update of flake inputs.

            This PR was created by the weekly flake update workflow.
          commit-message: 'chore: update flake inputs'
          labels: dependencies
